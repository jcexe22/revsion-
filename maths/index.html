<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edexcel Foundation Maths Revision Tracker</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b1020}</style>
</head>
<body>
<iframe id="mathsApp" src="./app.html" title="Edexcel Foundation Maths Revision Tracker"></iframe>
<script>
const GROUPS=[
  {title:'1. Core Number Skills',start:1,end:13},
  {title:'2. Factors, Multiples & Powers',start:14,end:26},
  {title:'3. Fractions, Decimals, Percentages & Accuracy',start:27,end:40},
  {title:'4. Algebra Basics',start:41,end:60},
  {title:'5. Graphs',start:61,end:75},
  {title:'6. Equations & Inequalities',start:76,end:86},
  {title:'7. Sequences',start:87,end:95},
  {title:'8. Ratio',start:96,end:105},
  {title:'9. Scale & Proportion',start:106,end:114},
  {title:'10. Percentages, Interest, Growth & Decay',start:115,end:124},
  {title:'11. Compound Measures & Similarity',start:125,end:136},
  {title:'12. Angles, Shapes & Polygons',start:137,end:150},
  {title:'13. Constructions, Congruence & Transformations',start:151,end:167},
  {title:'14. Circles & 3D Shapes',start:168,end:181},
  {title:'15. Area, Perimeter, Surface Area & Volume',start:182,end:199},
  {title:'16. Bearings, Coordinates, Pythagoras & Trigonometry',start:200,end:209},
  {title:'17. Vectors',start:210,end:214},
  {title:'18. Basic Probability',start:215,end:224},
  {title:'19. Combined Probability',start:225,end:236},
  {title:'20. Statistics',start:237,end:266}
];

const frame=document.getElementById('mathsApp');
frame.addEventListener('load',()=>setTimeout(()=>{
  try{
    const d=frame.contentDocument;
    const science=d.querySelector('.toolbar a[href="../"]');
    if(science) science.remove();

    const subtitle=d.querySelector('.titlewrap .small');
    if(subtitle) subtitle.innerHTML='20 topic groups • 266 revision packages • <span id="saveStatus">Auto-save on</span> • saved in this browser';

    const style=d.createElement('style');
    style.textContent=`
      #app{margin-top:8px}
      .topic{margin:10px 0}
      .topic summary{padding:15px 16px;font-size:16px}
      .topic-count{font-size:12px;color:#9fb0cf;font-weight:600;margin-left:auto;margin-right:12px}
      @media(max-width:760px){.topic-count{display:none}}
    `;
    d.head.appendChild(style);

    const app=d.getElementById('app');
    if(!app || app.dataset.twentyGroups==='1') return;

    const allItems=[...app.querySelectorAll('.item')];
    const byId=new Map(allItems.map(el=>[Number(el.dataset.item),el]));
    const frag=d.createDocumentFragment();

    GROUPS.forEach(g=>{
      const detail=d.createElement('details');
      detail.className='topic';
      const ids=[];
      for(let id=g.start;id<=g.end;id++) if(byId.has(id)) ids.push(id);
      detail.dataset.ids=ids.join(',');

      const summary=d.createElement('summary');
      const vals=ids.map(id=>{
        const el=byId.get(id);
        return parseInt(el.querySelector('.value')?.textContent||'0',10)||0;
      });
      const average=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
      summary.innerHTML=`<span>${g.title}</span><span class="topic-count">${ids.length} packages</span><span class="topicPct">${average}%</span>`;

      const body=d.createElement('div');
      body.className='topic-body';
      ids.forEach(id=>body.appendChild(byId.get(id)));
      detail.append(summary,body);
      frag.appendChild(detail);
    });

    app.replaceChildren(frag);
    app.dataset.twentyGroups='1';
  }catch(err){console.error('20-group maths layout failed',err)}
},100));
</script>
</body>
</html>
