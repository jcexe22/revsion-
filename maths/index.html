<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edexcel Foundation Maths Revision Tracker</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b1020}</style>
</head>
<body>
<iframe id="mathsApp" src="./app.html" title="Edexcel Foundation Maths Revision Tracker"></iframe>
<script>
const frame=document.getElementById('mathsApp');
frame.addEventListener('load',()=>setTimeout(()=>{
  try{
    const d=frame.contentDocument;
    const science=d.querySelector('.toolbar a[href="../"]');
    if(science) science.remove();

    const extraStyle=d.createElement('style');
    extraStyle.textContent=`
      .major-section{margin:22px 0 30px}
      .major-section>h2{margin:0 0 10px;padding:0 2px;font-size:22px;color:#eef4ff}
      .major-section .topic{margin:9px 0}
      .major-section .topic summary{padding:13px 15px}
    `;
    d.head.appendChild(extraStyle);

    const app=d.getElementById('app');
    if(!app || app.dataset.regrouped==='1') return;
    const original=[...app.children].filter(el=>el.matches('details.topic'));
    const fragment=d.createDocumentFragment();

    original.forEach(big=>{
      const majorTitle=big.querySelector('summary span:first-child')?.textContent?.trim() || 'Maths';
      const section=d.createElement('section');
      section.className='major-section';
      const heading=d.createElement('h2');
      heading.textContent=majorTitle;
      section.appendChild(heading);

      const oldBody=big.querySelector('.topic-body');
      let current=null;
      [...oldBody.children].forEach(node=>{
        if(node.classList.contains('subhead')){
          current=d.createElement('details');
          current.className='topic';
          const summary=d.createElement('summary');
          summary.innerHTML=`<span>${node.textContent.trim()}</span><span class="topicPct">0%</span>`;
          const body=d.createElement('div');
          body.className='topic-body';
          current.append(summary,body);
          section.appendChild(current);
        }else if(node.classList.contains('item')){
          if(!current){
            current=d.createElement('details');
            current.className='topic';
            const summary=d.createElement('summary');
            summary.innerHTML='<span>Skills</span><span class="topicPct">0%</span>';
            const body=d.createElement('div');
            body.className='topic-body';
            current.append(summary,body);
            section.appendChild(current);
          }
          current.querySelector('.topic-body').appendChild(node);
        }
      });

      [...section.querySelectorAll('details.topic')].forEach(group=>{
        const items=[...group.querySelectorAll('.item')];
        const ids=items.map(el=>Number(el.dataset.item));
        group.dataset.ids=ids.join(',');
        const vals=items.map(el=>parseInt(el.querySelector('.value')?.textContent||'0',10)||0);
        const average=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;
        group.querySelector('.topicPct').textContent=average+'%';
      });
      fragment.appendChild(section);
    });

    app.replaceChildren(fragment);
    app.dataset.regrouped='1';
  }catch(err){console.error('Maths regrouping failed',err)}
},80));
</script>
</body>
</html>
