<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edexcel Foundation Maths Revision Tracker</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1020}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0b1020}</style>
</head>
<body>
<iframe id="mathsApp" src="./app.html" title="Edexcel Foundation Maths Revision Tracker"></iframe>
<script>
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);

// Same 266 package IDs as before. Only the visual grouping changes,
// so existing localStorage progress remains attached to the same items.
const GROUPS=[
  {title:'1. Number Basics, Factors, Powers & Roots',ids:range(1,24)},
  {title:'2. Exact Number, Fractions, Percentages & Accuracy',ids:range(25,40)},
  {title:'3. Algebra Foundations & Manipulation',ids:range(41,60)},
  {title:'4. Graphs, Equations, Inequalities & Sequences',ids:range(61,95)},
  {title:'5. Ratio, Proportion, Rates & Compound Measures',ids:range(96,136)},
  {title:'6. Angles, Constructions & Transformations',ids:range(137,167)},
  {title:'7. Geometry, Circles & 3D Shapes',ids:range(168,189)},
  {title:'8. Area, Volume, Pythagoras, Trigonometry & Vectors',ids:range(190,214)},
  {title:'9. Probability',ids:range(215,236)},
  {title:'10. Statistics',ids:range(237,266)}
];

const frame=document.getElementById('mathsApp');
frame.addEventListener('load',()=>setTimeout(()=>{
  try{
    const d=frame.contentDocument;

    const science=d.querySelector('.toolbar a[href="../"]');
    if(science) science.remove();

    const subtitle=d.querySelector('.titlewrap .small');
    if(subtitle) subtitle.innerHTML='10 maths groups • 266 packages • <span id="saveStatus">Auto-save on</span>';

    const note=d.querySelector('.note');
    if(note) note.innerHTML='<b>Saved memory is ON.</b> All <b>266 maths packages</b> are still here, now organised into <b>10 larger groups</b>. Your old progress is kept because every package keeps the same saved ID.';

    const style=d.createElement('style');
    style.textContent=`
      #app{margin-top:10px}
      .ten-group-wrap{margin:20px 0 34px}
      .ten-group-heading{margin:0 0 6px;padding:12px 14px;border-radius:14px;background:#17213a;border:1px solid #263452;font-size:21px;letter-spacing:.3px}
      .ten-group-sub{color:#9fb0cf;font-size:13px;margin:0 4px 12px}
      .topic{margin:10px 0}
      .topic summary{padding:14px 16px;font-size:16px}
      .topic-count{font-size:12px;color:#9fb0cf;font-weight:600;margin-left:auto;margin-right:12px}
      @media(max-width:760px){.topic-count{display:none}.ten-group-heading{font-size:18px}}
    `;
    d.head.appendChild(style);

    const app=d.getElementById('app');
    if(!app || app.dataset.tenGroups==='1') return;

    const allItems=[...app.querySelectorAll('.item')];
    const byId=new Map(allItems.map(el=>[Number(el.dataset.item),el]));

    // Safety check: every original package must appear exactly once.
    const assigned=GROUPS.flatMap(g=>g.ids);
    const unique=new Set(assigned);
    if(assigned.length!==266 || unique.size!==266 || Math.min(...unique)!==1 || Math.max(...unique)!==266){
      throw new Error('10-group layout does not contain all 266 unique packages.');
    }

    const wrap=d.createElement('section');
    wrap.className='ten-group-wrap';

    const h=d.createElement('h2');
    h.className='ten-group-heading';
    h.textContent='📚 10 Maths Revision Groups';
    wrap.appendChild(h);

    const sub=d.createElement('div');
    sub.className='ten-group-sub';
    sub.textContent='All 266 packages • progress saves automatically';
    wrap.appendChild(sub);

    GROUPS.forEach(g=>{
      const detail=d.createElement('details');
      detail.className='topic';
      detail.dataset.ids=g.ids.join(',');

      const vals=g.ids.map(id=>parseInt(byId.get(id)?.querySelector('.value')?.textContent||'0',10)||0);
      const average=vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):0;

      const summary=d.createElement('summary');
      summary.innerHTML=`<span>${g.title}</span><span class="topic-count">${g.ids.length} packages</span><span class="topicPct">${average}%</span>`;

      const body=d.createElement('div');
      body.className='topic-body';
      g.ids.forEach(id=>{
        const item=byId.get(id);
        if(item) body.appendChild(item);
      });

      detail.append(summary,body);
      wrap.appendChild(detail);
    });

    app.replaceChildren(wrap);
    app.dataset.tenGroups='1';
  }catch(err){
    console.error('10-group maths layout failed',err);
  }
},100));
</script>
</body>
</html>
